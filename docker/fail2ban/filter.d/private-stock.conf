# Failed sign-ins, read out of Caddy's access log (§12).
#
# The app throttles a guessed-at account rather than locking it, which is what stops somebody
# using a known email address as a remote off switch — but a throttle by design never makes
# the attempts stop arriving. This is the layer that does: a run of failures gets the source
# dropped at the firewall, so the next one never reaches the NAS at all.
#
# Caddy writes one JSON object per line. Rather than parse it, these match the field names as
# written — `"status":401` — which is also what keeps a URI or a user-agent that happens to
# contain the same digits from being counted as a failure.
#
# `<HOST>` is the address Caddy itself saw: `request.remote_ip`, the peer of the TLS
# connection. An `X-Forwarded-For` the client sent appears further along the line under
# `headers` and is deliberately not matched — believing it would let anybody get anybody
# else banned, which is the same mistake the app's own limiter avoids.
#
# `remote_ip` sits inside the `request` object, which Caddy emits before `status`, so the
# ordering below holds. The two alternatives cover `uri` and `status` in either order, since
# that pairing is not something to depend on across a Caddy upgrade.
#
# VERIFY THIS AGAINST A REAL LINE before trusting it — the format is Caddy's, not ours, and a
# filter that silently matches nothing looks exactly like a filter that is working:
#
#   docker exec private-stock-fail2ban \
#       fail2ban-regex /var/log/caddy/private-stock-access.log \
#                      /etc/fail2ban/filter.d/private-stock.conf --print-all-matched
#
# Make a couple of failed sign-ins first, so there is something to find.
#
# One caution when changing these: a 400 on registration is also what a *valid* code with an
# already-registered email address produces, so somebody being helped through joining could
# collect a ban. That is the trade for watching the route at all, and it is survivable because
# the ban is an hour and the admin can lift it -- but it is the reason registration is not
# watched for 401s, which it never returns anyway.

[Definition]

failregex = ^.*"remote_ip":"<HOST>".*"uri":"/api/auth/login".*"status":(401|429).*$
            ^.*"remote_ip":"<HOST>".*"status":(401|429).*"uri":"/api/auth/login".*$
            ^.*"remote_ip":"<HOST>".*"uri":"/api/auth/register".*"status":(400|429).*$
            ^.*"remote_ip":"<HOST>".*"status":(400|429).*"uri":"/api/auth/register".*$

# A 429 counts as well, and on purpose: it means the app's own per-address limiter has already
# refused this caller, which is a stronger signal than a single wrong password.
#
# Registration is watched too (§12c). A rejected invitation code is a 400 -- the service
# throws a ValidationError -- and somebody working through codes produces a run of them. The
# code carries about fifty bits, so this is not what makes guessing hopeless; it is what stops
# the attempt from costing a request each time. A person mistyping a code they were given gets
# five tries before the ten-minute window, which is more than anybody needs for ten characters
# the form regroups as they type.

# Nothing is exempt. A successful sign-in is a 200 and never matches, so there is no
# legitimate line to exclude here.
ignoreregex =

[Init]

# Caddy logs `ts` as a Unix float. Saying so means a ban is dated from when the request
# happened rather than from when fail2ban got round to reading the line — which matters after
# a restart, when it works through a backlog.
datepattern = "ts":{EPOCH}
