<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!--
        The seal: oxblood wax pressed with a brass keyhole. "Private stock" is the bottles the
        house keeps for itself, and a seal is what says so. It deliberately says nothing about
        what the library holds, because this icon sits in tab strips and on home screens.

        This file is the source. favicon.ico and apple-icon.png beside it are rendered from it
        by scripts/render-icons.mjs; edit this, then run `pnpm icons:render`.

        Colours are the theme's (apps/web/src/theme.ts): oxblood 4/5/8 for the wax, brass
        2/5/9 for the keyhole.
    -->
    <defs>
        <radialGradient id="wax" cx="38%" cy="32%" r="75%">
            <stop offset="0" stop-color="#e3353f" />
            <stop offset=".55" stop-color="#b31220" />
            <stop offset="1" stop-color="#7a0214" />
        </radialGradient>
        <radialGradient id="well" cx="60%" cy="65%" r="70%">
            <stop offset="0" stop-color="#b31220" />
            <stop offset="1" stop-color="#7a0214" />
        </radialGradient>
        <!--
            One gradient over the keyhole's full height, in user space. Each shape used to
            take its own bounding box, so the head ended dark and the foot restarted light
            exactly where they meet.
        -->
        <linearGradient
            id="brass"
            gradientUnits="userSpaceOnUse"
            x1="0"
            y1="22.4"
            x2="0"
            y2="43.4"
        >
            <stop offset="0" stop-color="#e6d2ad" />
            <stop offset=".45" stop-color="#c99a41" />
            <stop offset="1" stop-color="#866014" />
        </linearGradient>
    </defs>

    <!-- The pressed edge: a circle of r=28 disturbed by three incommensurate ripples. -->
    <path
        fill="url(#wax)"
        d="M61.66,32L61.99,33.97L61.15,35.84L59.72,37.51L58.74,39.17L58.5,41L58.25,42.87L57.17,44.41L55.41,45.52L53.8,46.57L52.84,47.99L52.22,49.74L51.47,51.47L50.54,53.14L49.66,55.02L48.73,57.04L47.3,58.5L45.17,58.71L42.75,57.96L40.6,57.34L38.87,57.64L37.28,58.52L35.57,59.1L33.78,59.1L32,59.04L30.21,59.38L28.34,59.82L26.47,59.82L24.65,59.44L22.75,59.25L20.66,59.39L18.63,59.11L17.18,57.66L16.48,55.23L15.99,52.86L15.04,51.34L13.5,50.5L11.81,49.7L10.32,48.64L8.83,47.48L7.14,46.35L5.61,45.01L4.85,43.25L4.83,41.22L4.78,39.29L4.09,37.55L3.22,35.79L3.17,33.89L4.28,32L5.7,30.28L6.43,28.63L6.31,26.89L5.98,25.03L5.86,23.13L5.77,21.13L5.56,18.96L5.72,16.82L6.9,15.23L9.05,14.39L11.28,13.83L12.85,12.85L13.89,11.35L15.08,9.95L16.76,9.19L18.61,8.81L20.23,8.13L21.63,6.97L23.1,5.77L24.73,4.88L26.43,4L28.15,2.78L30.01,1.67L32,1.66L33.89,3.1L35.54,5.1L37.09,6.41L38.78,6.68L40.62,6.61L42.4,6.9L44.08,7.5L45.87,7.97L47.82,8.33L49.59,9.07L50.94,10.4L52.12,11.88L53.61,13.05L55.39,14.05L56.68,15.51L56.84,17.66L56.2,20.07L55.84,22.13L56.39,23.72L57.53,25.16L58.62,26.71L59.54,28.37L60.6,30.13Z"
    />

    <!-- The impression: a recessed field with a dark lip and a lit rim outside it. -->
    <circle cx="32" cy="32" r="20" fill="url(#well)" stroke="#5c0210" stroke-width="1.6" />
    <circle
        cx="32"
        cy="32"
        r="21.6"
        fill="none"
        stroke="#e3353f"
        stroke-opacity=".45"
        stroke-width=".9"
    />

    <!--
        The keyhole, one outline: the head's arc (r=5.6 about 32,28) runs over the top from
        where it meets one flared side of the foot to where it meets the other.
    -->
    <path
        fill="url(#brass)"
        d="M28.88 32.65A5.6 5.6 0 1 1 35.12 32.65L36.6 42.5Q32 43.6 27.4 42.5Z"
    />
</svg>
